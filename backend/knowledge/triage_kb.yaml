# -----------------------------------------------------------------------------
# HIGH-RISK VITAL SIGNS  (WHO IITT, age-banded)
# -----------------------------------------------------------------------------
# Evaluated ONLY when a reading is entered (audio cannot supply vitals). Any
# abnormal reading up-triages to EMERGENCY / immediate clinician review per the
# IITT ("patients with high-risk vital signs need up-triage or immediate review
# by a supervising clinician"). Numeric vitals use age-banded normal ranges;
# a reading below `low` or above `high` is abnormal. AVPU is abnormal when not
# 'A' (alert). When age is unknown the adult band is used.
vital_signs:
  source:
    evidence_level: guideline
    review_status: chart-verified
    mapped_scale: "WHO IITT high-risk vital signs"
    ref: "IITT high-risk vital signs (age-banded HR/RR, temperature, SpO2, AVPU)."
    url: "https://www.who.int/tools/triage"
  age_bands:
    - id: infant
      label: "under 1 year"
      min_age: 0
      max_age: 1
    - id: young-child
      label: "1 to 4 years"
      min_age: 1
      max_age: 5
    - id: child
      label: "5 to 12 years"
      min_age: 5
      max_age: 12
    - id: adult
      label: "12 and over"
      min_age: 12
  thresholds:
    - id: heart_rate
      label: "Heart rate"
      unit: " bpm"
      category: EMERGENCY
      kind: numeric
      bands:
        infant: { low: 90, high: 180 }
        young-child: { low: 80, high: 160 }
        child: { low: 70, high: 140 }
        adult: { low: 60, high: 130 }
    - id: resp_rate
      label: "Respiratory rate"
      unit: "/min"
      category: EMERGENCY
      kind: numeric
      bands:
        infant: { low: 25, high: 50 }
        young-child: { low: 20, high: 40 }
        child: { low: 10, high: 30 }
        adult: { low: 10, high: 30 }
    - id: temperature
      label: "Temperature"
      unit: "°C"
      category: EMERGENCY
      kind: numeric
      bands:
        all: { low: 36, high: 39 }
    - id: spo2
      label: "Oxygen saturation"
      unit: "%"
      category: EMERGENCY
      kind: numeric
      bands:
        all: { low: 92, high: null }
    - id: avpu
      label: "Responsiveness (AVPU)"
      category: EMERGENCY
      kind: avpu
      bands: {}

# -----------------------------------------------------------------------------
# CONDITIONS  (probabilistic differential — likelihood-ratio Bayesian layer)
# -----------------------------------------------------------------------------
# The engine ranks these by posterior probability: it starts from `prior`
# (baseline prevalence; tune to LOCAL epidemiology) and multiplies the odds by
# each present finding's likelihood ratio (`lr`). This is naive-Bayes single-
# disease scoring for RANKING a differential — it augments the "possible
# conditions" list and must never override the deterministic acuity path.
#
# IMPORTANT: the priors and LRs below are PROVISIONAL starter estimates for the
# mechanism. Replace them with cited values (e.g. JAMA Rational Clinical
# Examination for LRs; national/WHO prevalence for priors) during clinical
# review. `age`/`sex`/`pregnant` conditions are gated by `applies_when`.
conditions:
  - id: malaria
    label: "Malaria"
    prior: 0.15
    department: "General Outpatient / Internal Medicine"
    source:
      evidence_level: provisional
      review_status: unreviewed
      mapped_scale: "Literature LRs + local prevalence (to be sourced)"
      ref: "Provisional prior/LRs; endemic prior, tune to local malaria prevalence."
      url: "https://www.who.int/health-topics/malaria"
    findings:
      - { match: "malaria", lr: 18 }
      - { match: "fever", lr: 3 }
      - { match: "chills", lr: 4 }
      - { match: "shivering", lr: 3 }
      - { match: "sweating at night", lr: 2.5 }
      - { match: "body is hot", lr: 2 }
      - { match: "headache", lr: 1.4 }

  - id: typhoid
    label: "Typhoid fever"
    prior: 0.06
    department: "General Outpatient / Internal Medicine"
    source:
      evidence_level: provisional
